services:
  mvp:
    platform: linux/amd64
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface   # Whisper + Kokoro model cache
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_BASE_URL=https://camp-azr15256-tuqvj.openai.azure.com/
      - OPENAI_API_KEY=E4X2D4uG3z7JEY1RBvorZtQ8BYVuKHL51l0XlIDMbW556h9X9nEXJQQJ99CCACHYHv6XJ3w3AAABACOGeb4E
      - OPENAI_MODEL=gpt-5.4-mini-deployment-6f8e4
      - OPENAI_EMBED_MODEL=text-embedding-3-small
      - OPENAI_API_VERSION=2025-01-01-preview
      - OPENAI_TIMEOUT_S=60
      - TTS_MODEL=tts-1-hd
      - TTS_VOICE=alloy
      - USE_LOCAL_TTS=1
      - TTS_LOCAL_VOICE=af_heart
      - DATABASE_URL=sqlite:////app/data/ai_coach.db
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}

volumes:
  hf_cache:
